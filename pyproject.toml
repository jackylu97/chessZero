[project]
name = "chesszero"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0.0",
    "numpy>=2.2.6",
    "psutil>=5.9.0",
    "python-chess>=1.999",
    "tensorboard>=2.20.0",
    "torch>=2.11.0",
    "tqdm>=4.67.3",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.uv]
# Deps-only project: the root isn't an installable package (scripts self-insert
# the repo root into sys.path), so don't try to build/install it on `uv sync`.
package = false
